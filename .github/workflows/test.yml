name: tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 与本地基线一致：Godot 4.7.2 stable（纯 GDScript，不需要 .NET）
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run all headless tests
        run: godot --headless --path . --script tests/run_all.gd
